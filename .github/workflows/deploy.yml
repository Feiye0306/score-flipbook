name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyCeeGF_LgY278WEU_Brt3RnfhSEFXbbQa8' }}
          VITE_FIREBASE_AUTH_DOMAIN: 'my-tools-hub-1fdb1.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'my-tools-hub-1fdb1'
          VITE_FIREBASE_STORAGE_BUCKET: 'my-tools-hub-1fdb1.firebasestorage.app'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '582521185512'
          VITE_FIREBASE_APP_ID: '1:582521185512:web:634df5d9155f5eeffbd55d'
          VITE_FIREBASE_MEASUREMENT_ID: 'G-829TLNH2K3'
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
